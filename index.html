<!DOCTYPE html><html lang='id'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>SLI Live Tracking - Select Area</title>
<style>
 :root{--acc:#8ac640;--acc2:#4d8f27;--ink:#e6edf6;--mut:#8fa3b8;--line:#ffffff14}
 body{color:var(--ink);font:14px/1.5 'Segoe UI',sans-serif;margin:0;min-height:100vh;background:#0b1220;
   background-image:radial-gradient(700px 340px at 12% -6%,#76b04326,transparent 70%),
                    radial-gradient(900px 460px at 108% 8%,#3b82f61f,transparent 70%),
                    linear-gradient(#ffffff07 1px,transparent 1px),
                    linear-gradient(90deg,#ffffff07 1px,transparent 1px);
   background-size:auto,auto,36px 36px,36px 36px;background-attachment:fixed;
   display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box}
 .logo{height:64px;filter:invert(1) hue-rotate(180deg) saturate(1.15) brightness(1.06)}
 h1{font-size:26px;margin:16px 0 4px;letter-spacing:.5px;text-align:center}
 .sub{color:var(--mut);font-size:12.5px;text-align:center;letter-spacing:2.5px;text-transform:uppercase}
 .cities{display:grid;grid-template-columns:repeat(3,minmax(240px,320px));gap:22px;margin-top:34px;width:100%;
   max-width:1060px;justify-content:center}
 @media(max-width:960px){.cities{grid-template-columns:minmax(240px,420px)}}
 .city{position:relative;display:block;height:430px;border-radius:18px;overflow:hidden;
   background-size:cover;background-position:center;border:none;text-decoration:none;
   transition:transform .25s ease,box-shadow .25s ease;box-shadow:0 12px 34px #00000066}
 .city .ov{position:absolute;inset:0;background:linear-gradient(180deg,#0b122022 0%,#0b1220b3 60%,#0b1220 100%)}
 .city:hover{transform:translateY(-8px);box-shadow:0 0 0 1px #8ac64066,0 20px 44px #000000aa}
 .cnm{position:absolute;left:22px;bottom:58px;font-size:22px;font-weight:800;letter-spacing:2.5px;color:#fff;
   text-shadow:0 2px 10px #000}
 .go{position:absolute;left:22px;bottom:26px;color:var(--acc);font-weight:700;font-size:12.5px;letter-spacing:2px}
 .off{filter:grayscale(.65) brightness(.85);cursor:not-allowed}
 .off:hover{transform:none;box-shadow:0 12px 34px #00000066}
 .soon{position:absolute;top:16px;right:16px;background:#0b1220d9;border:1px solid #ffffff26;color:#cbd5e1;
   font-size:10.5px;letter-spacing:2px;padding:4px 11px;border-radius:99px;font-weight:700}
 .live{position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;
   font-weight:700;color:var(--acc);border:1px solid #8ac64066;border-radius:99px;padding:3px 10px;
   letter-spacing:2px;background:#0b1220d9}
 .live i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:denyut 1.6s infinite}
 @keyframes denyut{0%{box-shadow:0 0 0 0 #8ac64080}70%{box-shadow:0 0 0 8px #8ac64000}100%{box-shadow:0 0 0 0 #8ac64000}}
 .foot{margin-top:30px;color:var(--mut);font-size:11.5px}
</style></head><body>
